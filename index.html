<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UniversalPhiEngine</title>
<style>
  html,body{width:240px;height:282px;margin:0;padding:0;overflow:hidden;box-sizing:border-box;background:#0b0b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
  *{box-sizing:border-box}
  .wrap{width:240px;height:282px;padding:4px 8px;display:flex;flex-direction:column}
  h1{font-size:13px;margin:0 0 2px;color:#ffd700;flex-shrink:0}
  .phi{font-size:10px;line-height:1.25;margin:0 0 2px;flex-shrink:0}
  .phi b{color:#ffd700}
  .pass{color:#2ee06a;font-weight:bold}
  .rung{font-size:11px;margin:2px 0;flex-shrink:0}
  .rung b{color:#ffd700}
  canvas{display:block;width:224px;flex:1;min-height:0;background:#11131f;border:1px solid #333;border-radius:6px}
  .hint{font-size:9px;color:#bbb;margin:2px 0 0;line-height:1.2;flex-shrink:0}
  button{width:100%;margin-top:3px;padding:5px;background:#fe5000;color:#fff;border:0;border-radius:6px;font-size:12px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>UniversalPhiEngine</h1>
  <p class="phi">phi = <b>1.618033988749895</b><br>
  phi&sup2; = <span id="phi2"></span><br>
  phi + 1 = <span id="phiplus1"></span><br>
  check: <span id="check" class="pass"></span></p>
  <p class="rung">Rung n = <b id="n">0</b> &nbsp; phi^n = <b id="phin">1</b></p>
  <canvas id="plot" width="224" height="100"></canvas>
  <p class="hint">Scroll: step rung. Reset: n=0.</p>
  <button id="reset" type="button">Reset (side button)</button>
</div>
<script>
(function(){
  var PHI = 1.618033988749895;
  var phi2 = PHI * PHI;
  var phiplus1 = PHI + 1;
  var diff = Math.abs(phi2 - phiplus1);
  document.getElementById('phi2').textContent = phi2.toFixed(15);
  document.getElementById('phiplus1').textContent = phiplus1.toFixed(15);
  document.getElementById('check').textContent = (diff < 0.000000000001) ? 'PASS phi^2 == phi + 1' : 'FAIL diff=' + diff;
  var n = 0;
  var SPACING = 4;
  var GOLDEN_ANGLE = 137.5077640500378;
  function goldenLoc(i){
    var a = GOLDEN_ANGLE * i * Math.PI / 180;
    var r = SPACING * Math.sqrt(i);
    return {x: r * Math.cos(a), y: r * Math.sin(a)};
  }
  function save(){
    try {
      var v = JSON.stringify({n: n});
      if (window.creationStorage && window.creationStorage.plain && window.creationStorage.plain.setItem) {
        window.creationStorage.plain.setItem('phi-rung', v);
      } else if (window.localStorage) {
        window.localStorage.setItem('phi-rung', v);
      }
    } catch (e) {}
  }
  function load(){
    try {
      var v = null;
      if (window.creationStorage && window.creationStorage.plain && window.creationStorage.plain.getItem) {
        v = window.creationStorage.plain.getItem('phi-rung');
      } else if (window.localStorage) {
        v = window.localStorage.getItem('phi-rung');
      }
      if (v) {
        var o = JSON.parse(v);
        if (typeof o.n === 'number' && isFinite(o.n)) { n = Math.max(0, Math.min(21, Math.round(o.n))); }
      }
    } catch (e) {}
  }
  function draw(){
    var c = document.getElementById('plot');
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 224, 100);
    var cx = 112, cy = 50;
    ctx.fillStyle = '#4aa8ff';
    for (var i = 0; i <= 180; i++) {
      var p = goldenLoc(i);
      ctx.beginPath();
      ctx.arc(cx + p.x, cy + p.y, 1.4, 0, 6.283185307179586);
      ctx.fill();
    }
    var cur = goldenLoc(n);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(cx + cur.x, cy + cur.y, 4, 0, 6.283185307179586);
    ctx.fill();
    document.getElementById('n').textContent = String(n);
    document.getElementById('phin').textContent = Math.pow(PHI, n).toFixed(6);
  }
  function step(d){ n = Math.max(0, Math.min(21, n + d)); save(); draw(); }
  function reset(){ n = 0; save(); draw(); }
  window.addEventListener('wheel', function(e){ e.preventDefault(); step(e.deltaY < 0 ? 1 : -1); }, {passive: false});
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowUp') { step(1); }
    else if (e.key === 'ArrowDown') { step(-1); }
    else if (e.key === ' ' || e.key === 'Enter') { reset(); }
  });
  document.getElementById('reset').addEventListener('click', reset);
  load();
  draw();
})();
</script>
</body>
</html>
