<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UniversalPhiEngine ONE</title>
<style>
  html,body{width:240px;height:282px;margin:0;padding:0;overflow:hidden;box-sizing:border-box;background:#0b0b12;color:#fff;font-family:Arial,Helvetica,sans-serif}
  *{box-sizing:border-box}
  .wrap{width:240px;height:282px;padding:4px 8px;display:flex;flex-direction:column}
  h1{font-size:13px;margin:0 0 2px;color:#ffd700;flex-shrink:0}
  .phi{font-size:10px;line-height:1.25;margin:0 0 2px;flex-shrink:0}
  .phi b{color:#ffd700}
  .pass{color:#2ee06a;font-weight:bold}
  .status{font-size:10px;margin:2px 0;flex-shrink:0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e53935;vertical-align:middle}
  .dot.ok{background:#2ee06a}
  input{width:100%;padding:4px;font-size:11px;background:#11131f;color:#fff;border:1px solid #333;border-radius:6px;flex-shrink:0}
  button{width:100%;margin-top:3px;padding:5px;background:#fe5000;color:#fff;border:0;border-radius:6px;font-size:12px;flex-shrink:0}
  canvas{display:block;width:224px;height:50px;background:#11131f;border:1px solid #333;border-radius:6px;flex-shrink:0;margin-top:3px}
  #resp{flex:1;min-height:0;overflow:auto;font-size:10px;line-height:1.3;background:#11131f;border:1px solid #333;border-radius:6px;padding:4px;margin-top:3px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>UniversalPhiEngine</h1>
  <p class="phi">phi = <b>1.618033988749895</b><br>
  phi&sup2; = <span id="phi2"></span><br>
  phi + 1 = <span id="phiplus1"></span><br>
  check: <span id="check" class="pass"></span></p>
  <p class="status"><span id="dot" class="dot"></span> <span id="onestat">ONE: not tested</span></p>
  <input id="prompt" type="text" value="Hello ONE, say phi squared equals phi plus one">
  <button id="talk" type="button">Talk to ONE</button>
  <canvas id="plot" width="224" height="50"></canvas>
  <div id="resp">ONE reply will show here.</div>
</div>
<script>
(function(){
  var ONE = "https://symptoms-revised-les-private.trycloudflare.com";
  var MODEL = "one:latest";
  var PHI = 1.618033988749895;
  var phi2 = PHI * PHI;
  var phiplus1 = PHI + 1;
  var diff = Math.abs(phi2 - phiplus1);
  document.getElementById('phi2').textContent = phi2.toFixed(15);
  document.getElementById('phiplus1').textContent = phiplus1.toFixed(15);
  document.getElementById('check').textContent = (diff < 0.000000000001) ? 'PASS phi^2 == phi + 1' : 'FAIL diff=' + diff;
  var c = document.getElementById('plot');
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 224, 50);
  ctx.fillStyle = '#4aa8ff';
  for (var i = 0; i <= 180; i++) {
    var a = 137.5077640500378 * i * Math.PI / 180;
    var r = 4 * Math.sqrt(i);
    ctx.beginPath();
    ctx.arc(112 + r * Math.cos(a), 25 + r * Math.sin(a), 1.2, 0, 6.283185307179586);
    ctx.fill();
  }
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(112, 25, 4, 0, 6.283185307179586);
  ctx.fill();
  function setDot(ok, txt){
    var d = document.getElementById('dot');
    d.className = ok ? 'dot ok' : 'dot';
    document.getElementById('onestat').textContent = txt;
  }
  function talk(){
    var text = document.getElementById('prompt').value || 'Hello ONE';
    setDot(false, 'ONE: thinking...');
    document.getElementById('resp').textContent = 'Asking ONE...';
    fetch(ONE + "/api/generate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model: MODEL, prompt: text, stream: false})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.response) {
          setDot(true, 'ONE: connected');
          document.getElementById('resp').textContent = d.response;
        } else {
          setDot(false, 'ONE: no answer');
          document.getElementById('resp').textContent = 'No response from ONE.';
        }
      })
      .catch(function(e){
        setDot(false, 'ONE: no answer');
        document.getElementById('resp').textContent = 'ONE did not answer: ' + e;
      });
  }
  document.getElementById('talk').addEventListener('click', talk);
  window.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); talk(); }
  });
})();
</script>
</body>
</html>
